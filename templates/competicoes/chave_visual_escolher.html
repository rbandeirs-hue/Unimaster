{% extends "base_app.html" %}
{% block title %}Chave interativa — {{ evento.nome }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2 class="h5 fw-bold">Chave interativa</h2>
    <p class="text-muted">{{ evento.nome }} — escolha a categoria.</p>
    <div class="list-group">
        {% for cat in categorias %}
        <a href="{{ url_for('competicoes.chave_visual_evento', evento_id=evento.id, categoria=cat) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            {{ cat }}
            <i class="bi bi-diagram-3 text-primary"></i>
        </a>
        {% endfor %}
    </div>
    <a href="{{ url_voltar(back_url) }}" class="btn btn-outline-secondary btn-sm mt-3"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>
{% endblock %}
