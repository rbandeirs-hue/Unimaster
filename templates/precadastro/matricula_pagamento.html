{% extends "base_app.html" %}
{% block title %}Pagamento da matrícula — {{ p.nome }}{% endblock %}
{% block content %}
<div class="container my-4" style="max-width: 560px;">
  <div class="mb-3">
    <a href="{{ back_url }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>

  <div class="card border-0 shadow-sm" style="border-radius:16px;overflow:hidden;">
    <div class="card-body p-4">
      {% include "precadastro/_matricula_pagamento_conteudo.html" %}
    </div>
  </div>
</div>

<script>
  function copiar(id, btn) {
    var i = document.getElementById(id); i.select();
    var ok = function(){ var o=btn.innerHTML; btn.innerHTML='<i class="bi bi-check2"></i>'; setTimeout(function(){btn.innerHTML=o;},1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(i.value).then(ok).catch(function(){ try{document.execCommand('copy');}catch(e){} ok(); }); }
    else { try{document.execCommand('copy');}catch(e){} ok(); }
  }
</script>
{% endblock %}
