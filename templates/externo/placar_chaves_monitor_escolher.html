{% extends "externo/base_externo.html" %}
{% block title %}Chaves — Monitor{% endblock %}
{% block content %}
<div class="mb-3">
  <h5>Monitor de Chaves</h5>
  <p class="text-muted small">Escolha a categoria para exibir a chave no monitor/TV.</p>
</div>
<div class="list-group">
  {% for cat in categorias %}
  <a href="{{ url_for('externo.placar_chaves_monitor', evento_id=evento.id, categoria=cat) }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" target="_blank">
    {{ cat }}
    <i class="bi bi-tv text-primary"></i>
  </a>
  {% endfor %}
</div>
<div class="mt-3">
  <a href="{{ url_for('externo.placar_lista', evento_id=evento.id) }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Voltar ao Placar</a>
</div>
{% endblock %}
