{# Responsável com mais de um dependente escolhe de quem é a tela. #}
{% if alunos and alunos|length > 1 %}
<form method="GET" class="lst-filtros exf-nao-imprime">
  <label class="lst-campo lst-campo--curto">
    <span class="lst-campo__rotulo">Aluno</span>
    <select name="aluno_id" onchange="this.form.submit()">
      {% for a in alunos %}<option value="{{ a.id }}" {% if a.id == aluno.id %}selected{% endif %}>{{ a.nome }}</option>{% endfor %}
    </select>
  </label>
</form>
{% endif %}
