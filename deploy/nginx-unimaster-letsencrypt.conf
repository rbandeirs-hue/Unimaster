# Nginx Unimaster — HTTPS (Let's Encrypt) + proxy para Gunicorn em 127.0.0.1:8000
# Ajuste server_name e caminhos dos certificados.
#
# O bloco map deve estar incluído dentro de http { } (sites-available).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirecionar HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rmservicosnet.com.br www.rmservicosnet.com.br _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name rmservicosnet.com.br www.rmservicosnet.com.br _;

    ssl_certificate /etc/letsencrypt/live/rmservicosnet.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmservicosnet.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling: o Let's Encrypt por vezes não expõe OCSP neste cert; se nginx avisar, mantenha off.
    ssl_stapling off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /var/www/Unimaster/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
