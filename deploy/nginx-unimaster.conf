# Nginx — proxy para Gunicorn (Flask) em 127.0.0.1:8000
#
# Este ficheiro é incluído dentro de http { } (sites-available). O map tem de ficar no mesmo contexto.
#
#   sudo cp /var/www/Unimaster/deploy/nginx-unimaster.conf /etc/nginx/sites-available/unimaster
#   sudo ln -sf /etc/nginx/sites-available/unimaster /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ajuste server_name e TLS (certbot) em produção.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
