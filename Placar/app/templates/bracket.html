<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chave de Competição</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bracket.css') }}">
</head>
<body>
  <div id="app">

    <header class="header">
      <div class="header-info">
        <span id="comp-nome" class="comp-nome"></span>
        <h1 id="cat-nome">Carregando…</h1>
      </div>
      <div class="header-actions">
        <span id="status-dot" class="dot dot--live" title="Atualizando ao vivo"></span>
        <a href="{{ url_for('placar.pagina_categoria', categoria_id=categoria_id) }}" target="_blank" class="btn-refresh" title="URL fixa: acompanha a luta que a mesa abrir nesta categoria">📺 Placar</a>
        <button class="btn-refresh" onclick="carregarBracket()">↻ Atualizar</button>
        <a href="{{ url_for('home.index') }}" class="btn-refresh">← Início</a>
      </div>
    </header>

    <main>
      <div id="bracket-container">
        <div id="bracket-scroll">
          <div id="bracket"></div>
          <svg id="connectors" aria-hidden="true"></svg>
        </div>
      </div>

      <section id="secao-3lugar"></section>
      <section id="secao-colocacoes"></section>
    </main>

  </div>

  <script>const CATEGORIA_ID = {{ categoria_id }};</script>
  <script src="{{ url_for('static', filename='js/bracket.js') }}"></script>
</body>
</html>
