{% extends 'base.html' %}
{% block title %}Ajustar categoria — {{ comp.nome }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <a href="{{ url_for('admin.competicao_detalhe', comp_id=comp.id) }}" class="back-link">← {{ comp.nome }}</a>
    <h1>Ajustar categoria</h1>
    <p class="sub-info">{{ cat.nome }}</p>
  </div>
</div>

<div class="form-card" style="max-width:520px">
  <form method="POST" action="{{ url_for('admin.categoria_editar', cat_id=cat.id) }}">
    <div class="field">
      <label>Nome *</label>
      <input type="text" name="nome" required value="{{ cat.nome }}">
    </div>
    <div class="field">
      <label>Sexo *</label>
      <select name="sexo" required>
        <option value="M" {% if cat.sexo == 'M' %}selected{% endif %}>Masculino</option>
        <option value="F" {% if cat.sexo == 'F' %}selected{% endif %}>Feminino</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Idade mínima</label>
        <input type="number" name="idade_min" min="0" max="99"
               value="{{ cat.idade_min if cat.idade_min is not none else '' }}"
               placeholder="vazio = sem mínimo">
      </div>
      <div class="field">
        <label>Idade máxima</label>
        <input type="number" name="idade_max" min="0" max="99"
               value="{{ cat.idade_max if cat.idade_max is not none else '' }}"
               placeholder="vazio = sem máximo">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Peso mín. (kg)</label>
        <input type="text" name="peso_min" inputmode="decimal"
               value="{{ cat.peso_min if cat.peso_min is not none else '' }}"
               placeholder="ex: 28">
      </div>
      <div class="field">
        <label>Peso máx. (kg)</label>
        <input type="text" name="peso_max" inputmode="decimal"
               value="{{ cat.peso_max if cat.peso_max is not none else '' }}"
               placeholder="aberto se vazio">
      </div>
    </div>
    <div class="field field--checkbox">
      <input type="hidden" name="ativo" value="0" />
      <label class="checkbox-label">
        <input type="checkbox" name="ativo" value="1" {% if cat.ativo %}checked{% endif %} />
        Categoria ativa (visível nas listagens da API)
      </label>
    </div>
    <button type="submit" class="btn-submit">Salvar alterações</button>
  </form>
</div>
{% endblock %}
