<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Placar Judô</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body class="body--centered">

<div class="login-box">
  <div class="login-logo">⚔️</div>
  <h1 class="login-titulo">Placar Judô</h1>
  <p class="login-sub">Sistema de competição CBJ</p>

  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="flash flash--{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.login_post') }}" class="login-form">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autofocus placeholder="admin@clube.com">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required placeholder="••••••••">
    </div>
    <label class="check-label">
      <input type="checkbox" name="lembrar"> Manter conectado
    </label>
    <button type="submit" class="btn-submit">Entrar</button>
  </form>
</div>

</body>
</html>
